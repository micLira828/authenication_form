<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authentication Form</title>
  <link rel="stylesheet" href="form.css"/>

</head>

<body>
  <!--Image column-->
  <div class = "image-column">
    <!--logo-->
    <div class = "logo">
      <img src="images/odin-lined.png" alt="Image"/>
     
      <div>
          Odin
      </div>
    </div>
  </div>
  
  <!--Form Column-->
  <div class = "form-column">
    <!--description row-->
    <div class = "desc-row">
      <p>This is not a real online service! You know you need something like
        this is your life to help you realize your deepest dreams. Sign up now
        to get started.
      </p>
      <p>
        You know you want to.
      </p>
    </div>
    <!--form row-->
    <div class = "form-row">
      <form>
        <div class="form-container">
        Lets do this!
        <div class="form-grid"> 
           <label for="firstName">
          First Name
           <input type = "text" name = "firstName" id = "firstName"/>
        </label>
        <label for="lastName">
            Last Name
            <input type = "text" name = "lastName" id = "lastName" />
        </label>
        <label for="email">
             Email
             <input type = "email"  name = "email" id = "email" />
        </label>
        <label for="phoneNumber">
           Phone Number
            <input type = "tele" name = "phoneNumber" id = "phoneNumber"/>
        </label>
        <label for="password">
              Password
              <input class = "pass" type = "password" name="password" id = "password"/>
        </label>
          <label for="confirmPassword">
                    Confirm Password
                    <input class = "pass"  type = "password" name="confirmPassword" id = "confirmPassword"/>
          </label>
        </div>
       </div>
    </form>
  </div>
  </div>
</body>

</html>
